name: Hugging Face Spaces Keepalive
# Project docs: README.md


on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Hugging Face Spaces
        shell: bash
        run: |
          set -o pipefail

          success_count=0
          failure_count=0
          failed_spaces=()
          checked_count=0

          header() {
            printf '=%.0s' {1..52}; echo
            echo "Hugging Face Spaces Keepalive"
            printf '=%.0s' {1..52}; echo
            echo
          }

          footer() {
            printf '=%.0s' {1..52}; echo
            echo "Summary"
            printf '=%.0s' {1..52}; echo
            echo
            echo "Total Spaces: $checked_count"
            echo "Successful: $success_count"
            echo "Failed: $failure_count"
            echo

            if (( failure_count > 0 )); then
              echo "Failed Spaces:"
              for failed_space in "${failed_spaces[@]}"; do
                echo "- $failed_space"
              done
              echo
              echo "Workflow result: FAILURE"
              exit 1
            fi

            echo "Workflow result: SUCCESS"
          }

          check_space() {
            local name="$1"
            local url="$2"
            local start_time end_time elapsed status output

            start_time="$(date +%s%N)"

            if ! output="$(curl \
                  --location \
                  --silent \
                  --show-error \
                  --output /dev/null \
                  --write-out "%{http_code} %{time_total}" \
                  --connect-timeout 15 \
                  --max-time 90 \
                  --retry 3 \
                  --retry-delay 5 \
                  --retry-all-errors \
                  "$url" 2>&1)"; then
              status="000"
              elapsed="0"
            else
              status="$(awk 'END{print $1}' <<<"$output")"
              elapsed="$(awk 'END{print $2}' <<<"$output")"
            fi

            end_time="$(date +%s%N)"
            elapsed="$(( (end_time - start_time) / 1000000 ))"

            if [[ -z "$elapsed" ]]; then
              elapsed="0"
            fi

            if [[ "$status" =~ ^[0-9]+$ ]] && (( status >= 200 && status < 400 )); then
              result="SUCCESS"
              success_count=$((success_count + 1))
            else
              result="FAILED"
              failure_count=$((failure_count + 1))
              failed_spaces+=("$name")
            fi

            echo "Checking: $name"
            echo "URL: $url"
            echo
            echo "HTTP Status: $status"
            echo "Response Time: ${elapsed}ms"
            echo "Result: $result"
            echo
            printf -- '-%.0s' {1..52}; echo
            echo
          }

          header

          while IFS='|' read -r name url; do
            if [[ -z "${name// }" || -z "${url// }" ]]; then
              continue
            fi

            checked_count=$((checked_count + 1))
            check_space "$name" "$url"
          done <<'SPACES'
ava2lon-litellm|https://ava2lon-litellm.hf.space/
ava2lon-flux|https://ava2lon-flux.hf.space/
basyx-n8n|https://basyx-n8n.hf.space/
basyx-mediarouter|https://basyx-mediarouter.hf.space/
basyx-whisper|https://basyx-whisper.hf.space/
basyx-ai-gateway|https://basyx-ai-gateway.hf.space/
ava2lon-ktts|https://ava2lon-ktts.hf.space/
ava2lon-ffmpeg|https://ava2lon-ffmpeg.hf.space/
ava2lon-studio|https://ava2lon-studio.hf.space/
SPACES

          footer
